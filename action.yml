name: 'SolAudit'
description: 'Static analysis for Solana/Anchor programs. Scans for common on-chain vulnerability patterns and can upload results to GitHub code scanning.'
author: 'Cody Pack'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'File or directory to scan.'
    required: false
    default: '.'
  min-severity:
    description: 'Only report findings at or above this severity (CRITICAL | HIGH | MEDIUM | LOW | INFO).'
    required: false
    default: 'INFO'
  fail-on-findings:
    description: 'Fail this step if any CRITICAL or HIGH severity finding is present, regardless of min-severity.'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Upload SARIF results to GitHub code scanning. Requires the security-events: write permission on the job.'
    required: false
    default: 'true'

outputs:
  sarif-file:
    description: 'Path to the generated SARIF file, when upload-sarif is enabled.'
    value: ${{ steps.scan-sarif.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    # Pin to a published npm version. Bump this after `npm publish` of a new CLI.
    # Install into a temp dir instead of `npx solaudit`: when the consuming repo
    # defines a local package/workspace named "solaudit" (like this monorepo),
    # npx resolves that local package instead of the registry release and fails
    # with "solaudit: not found".
    - name: Install SolAudit
      shell: bash
      run: |
        INSTALL_DIR=$(mktemp -d)
        npm install --no-save --prefix "$INSTALL_DIR" solaudit@0.2.0 --silent
        echo "SOLAUDIT_BIN=$INSTALL_DIR/node_modules/.bin/solaudit" >> "$GITHUB_ENV"

    - name: Run SolAudit
      shell: bash
      run: "$SOLAUDIT_BIN" "${{ inputs.path }}" --min-severity "${{ inputs['min-severity'] }}"
      continue-on-error: true

    - name: Generate SARIF report
      id: scan-sarif
      if: ${{ inputs['upload-sarif'] == 'true' }}
      shell: bash
      run: |
        # solaudit exits 1 when CRITICAL/HIGH findings exist, even with --sarif.
        # That's correct for gating, but this step only generates the report file
        # (the actual pass/fail gate is the separate step below), so don't let a
        # non-zero exit here fail the job.
        "$SOLAUDIT_BIN" "${{ inputs.path }}" --sarif > solaudit-results.sarif || true
        echo "sarif-file=solaudit-results.sarif" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to GitHub code scanning
      if: ${{ inputs['upload-sarif'] == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: solaudit-results.sarif

    - name: Enforce CRITICAL/HIGH findings gate
      if: ${{ inputs['fail-on-findings'] == 'true' }}
      shell: bash
      run: "$SOLAUDIT_BIN" "${{ inputs.path }}" --min-severity HIGH
